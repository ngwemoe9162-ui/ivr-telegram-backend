<script>


/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
"https://pjiiipywtywkztgjpmro.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_6Vjf1hUSWxI2HXRJ9eSHfw_OU8Vm2G5";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);



/* =====================================================
   PAGE LOAD
===================================================== */

window.addEventListener(
    "load",
    checkAdminSession
);



/* =====================================================
   AUTH SESSION CHECK
===================================================== */

async function checkAdminSession() {

    try {

        const {
            data,
            error
        } =
            await supabaseClient.auth.getSession();


        if (error) {

            throw error;

        }


        const session =
            data?.session;


        if (session) {

            showAdminPanel();

        } else {

            showLogin();

        }


    } catch (error) {

        console.error(
            "SESSION CHECK ERROR:",
            error
        );

        showLogin();

    }

}



/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin() {

    document
        .getElementById("loginScreen")
        .classList.remove("hidden");


    document
        .getElementById("adminApp")
        .classList.add("hidden");

}



/* =====================================================
   SHOW ADMIN PANEL
===================================================== */

async function showAdminPanel() {

    document
        .getElementById("loginScreen")
        .classList.add("hidden");


    document
        .getElementById("adminApp")
        .classList.remove("hidden");


    await loadPackages();

}



/* =====================================================
   LOGIN
===================================================== */

async function loginAdmin() {

    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();


    const password =
        document
        .getElementById("loginPassword")
        .value;


    if (!email) {

        alert(
            "Please enter your admin email."
        );

        return;

    }


    if (!password) {

        alert(
            "Please enter your password."
        );

        return;

    }


    const button =
        document
        .getElementById("loginBtn");


    button.disabled = true;


    button.innerHTML = `
        <i class="fa-solid fa-spinner
        fa-spin mr-1"></i>
        Logging in...
    `;


    try {

        const {
            data,
            error
        } =
            await supabaseClient.auth
            .signInWithPassword({

                email: email,

                password: password

            });


        if (error) {

            throw error;

        }


        if (!data?.session) {

            throw new Error(
                "Login successful but no session was created."
            );

        }


        await showAdminPanel();


    } catch (error) {

        console.error(
            "LOGIN ERROR:",
            error
        );


        alert(
            "Login failed:\n\n" +
            (
                error.message ||
                String(error)
            )
        );


    } finally {

        button.disabled = false;


        button.innerHTML = `
            <i class="fa-solid
            fa-right-to-bracket mr-1"></i>
            Login
        `;

    }

}



/* =====================================================
   PASSWORD SHOW / HIDE
===================================================== */

function togglePassword() {

    const input =
        document
        .getElementById(
            "loginPassword"
        );


    const eye =
        document
        .getElementById(
            "passwordEye"
        );


    if (
        input.type ===
        "password"
    ) {

        input.type = "text";


        eye.className =
            "fa-solid fa-eye-slash";

    } else {

        input.type = "password";


        eye.className =
            "fa-solid fa-eye";

    }

}



/* =====================================================
   LOGOUT
===================================================== */

async function logoutAdmin() {

    const confirmLogout =
        confirm(
            "Are you sure you want to logout?"
        );


    if (!confirmLogout) {

        return;

    }


    try {

        const {
            error
        } =
            await supabaseClient.auth
            .signOut();


        if (error) {

            throw error;

        }


        location.reload();


    } catch (error) {

        console.error(
            "LOGOUT ERROR:",
            error
        );


        alert(
            "Logout failed:\n\n" +
            (
                error.message ||
                String(error)
            )
        );

    }

}



/* =====================================================
   BOOLEAN NORMALIZER
===================================================== */

function toBoolean(value) {

    if (
        typeof value ===
        "boolean"
    ) {

        return value;

    }


    if (
        typeof value ===
        "number"
    ) {

        return value === 1;

    }


    const text =
        String(
            value ?? ""
        )
        .trim()
        .toLowerCase();


    return (

        text === "true" ||
        text === "1" ||
        text === "yes" ||
        text === "on"

    );

}



/* =====================================================
   LOAD PACKAGES
===================================================== */

async function loadPackages() {

    const list =
        document.getElementById(
            "packageList"
        );


    if (!list) {

        return;

    }


    const filter =
        document.getElementById(
            "filterGame"
        ).value;


    list.innerHTML = `

        <div
        class="text-center py-10
        text-gray-500">

            <i
            class="fa-solid
            fa-spinner fa-spin text-xl">
            </i>

            <p class="text-xs mt-2">

                Loading packages...

            </p>

        </div>

    `;


    try {

        let query =
            supabaseClient
            .from("packages")
            .select(`
                id,
                game,
                name,
                bonus,
                price,
                icon,
                highlight,
                active
            `)
            .order(
                "id",
                {
                    ascending: true
                }
            );


        if (
            filter !==
            "all"
        ) {

            query =
                query.eq(
                    "game",
                    filter
                );

        }


        const {
            data,
            error
        } =
            await query;


        if (error) {

            throw error;

        }


        const packages =
            (
                data || []
            )
            .map(
                pkg => {

                    return {

                        id:
                            pkg.id,

                        game:
                            String(
                                pkg.game ??
                                ""
                            )
                            .trim()
                            .toLowerCase(),

                        name:
                            String(
                                pkg.name ??
                                ""
                            ),

                        bonus:
                            String(
                                pkg.bonus ??
                                ""
                            ),

                        price:
                            Number(
                                pkg.price
                            ) || 0,

                        icon:
                            String(
                                pkg.icon ??
                                ""
                            )
                            .trim()
                            ||
                            "fa-solid fa-gem",

                        highlight:
                            toBoolean(
                                pkg.highlight
                            ),

                        active:
                            toBoolean(
                                pkg.active
                            )

                    };

                }
            );


        updateStats(
            packages
        );


        if (
            !packages.length
        ) {

            list.innerHTML = `

                <div
                class="text-center
                py-10 text-gray-500">

                    <i
                    class="fa-solid
                    fa-box-open
                    text-2xl mb-2">
                    </i>

                    <p class="text-sm">

                        No packages found.

                    </p>

                </div>

            `;

            return;

        }


        list.innerHTML = "";


        packages.forEach(
            pkg => {

                const card =
                    document
                    .createElement(
                        "div"
                    );


                card.className =
                    "bg-gray-950/70 border " +
                    "border-gray-800 rounded-xl p-4 " +
                    "flex flex-col md:flex-row " +
                    "md:items-center gap-4";


                const gameName =
                    pkg.game ===
                    "mlbb"
                    ?
                    "Mobile Legends"
                    :
                    "PUBG Mobile";


                const safePackage =
                    JSON.stringify(
                        pkg
                    )
                    .replace(
                        /'/g,
                        "&#39;"
                    );


                card.innerHTML = `

                    <!-- ICON -->

                    <div
                    class="w-11 h-11 shrink-0
                    rounded-xl
                    bg-cyan-500/10
                    text-cyan-400
                    flex items-center
                    justify-center">

                        <i
                        class="${escapeHtml(
                            pkg.icon
                        )}">
                        </i>

                    </div>


                    <!-- INFO -->

                    <div class="flex-1">

                        <div
                        class="flex items-center
                        gap-2 flex-wrap">


                            <span
                            class="font-bold text-white">

                                ${escapeHtml(
                                    pkg.name
                                )}

                            </span>


                            ${
                                pkg.highlight
                                ?
                                `
                                <span
                                class="text-[9px]
                                bg-amber-500
                                text-black px-2
                                py-0.5 rounded
                                font-black">

                                    HOT

                                </span>
                                `
                                :
                                ""
                            }


                            ${
                                pkg.active
                                ?
                                `
                                <span
                                class="text-[9px]
                                bg-emerald-500/20
                                text-emerald-400
                                px-2 py-0.5
                                rounded">

                                    ACTIVE

                                </span>
                                `
                                :
                                `
                                <span
                                class="text-[9px]
                                bg-red-500/20
                                text-red-400
                                px-2 py-0.5
                                rounded">

                                    OFF

                                </span>
                                `
                            }

                        </div>


                        <div
                        class="text-xs
                        text-gray-500 mt-1">

                            ${gameName}

                            •

                            ${escapeHtml(
                                pkg.bonus
                            )}

                        </div>

                    </div>


                    <!-- PRICE -->

                    <div
                    class="text-emerald-400
                    font-black
                    whitespace-nowrap">

                        ${Number(
                            pkg.price
                        ).toLocaleString()}
                        Ks

                    </div>


                    <!-- BUTTONS -->

                    <div
                    class="flex gap-2">


                        <!-- EDIT -->

                        <button
                        onclick='openEdit(${safePackage})'
                        class="px-3 py-2
                        rounded-lg
                        bg-cyan-500/10
                        text-cyan-400
                        border
                        border-cyan-500/20">

                            <i
                            class="fa-solid fa-pen">
                            </i>

                        </button>


                        <!-- ACTIVE -->

                        <button
                        onclick="toggleActive(
                            ${Number(pkg.id)},
                            ${pkg.active}
                        )"
                        class="px-3 py-2
                        rounded-lg
                        bg-gray-800
                        text-gray-300">

                            <i
                            class="fa-solid ${
                                pkg.active
                                ?
                                "fa-eye-slash"
                                :
                                "fa-eye"
                            }">
                            </i>

                        </button>


                    </div>

                `;


                list.appendChild(
                    card
                );

            }
        );


    } catch (error) {

        console.error(
            "LOAD PACKAGES ERROR:",
            error
        );


        list.innerHTML = `

            <div
            class="text-center py-8
            text-red-400 text-sm">

                <i
                class="fa-solid
                fa-triangle-exclamation
                text-xl mb-2">
                </i>


                <p>

                    Failed to load packages.

                </p>


                <p
                class="text-xs text-gray-500
                mt-2 break-all">

                    ${escapeHtml(
                        error.message ||
                        String(error)
                    )}

                </p>

            </div>

        `;

    }

}



/* =====================================================
   STATS
===================================================== */

function updateStats(data) {

    document.getElementById(
        "totalPackages"
    ).innerText =
        data.length;


    document.getElementById(
        "mlbbCount"
    ).innerText =
        data.filter(
            x =>
                x.game === "mlbb"
        ).length;


    document.getElementById(
        "pubgCount"
    ).innerText =
        data.filter(
            x =>
                x.game === "pubg"
        ).length;


    document.getElementById(
        "activeCount"
    ).innerText =
        data.filter(
            x =>
                x.active === true
        ).length;

}



/* =====================================================
   ADD PACKAGE
===================================================== */

async function addPackage() {

    const game =
        document.getElementById(
            "game"
        ).value;


    const name =
        document.getElementById(
            "packageName"
        ).value.trim();


    const bonus =
        document.getElementById(
            "bonus"
        ).value.trim();


    const price =
        Number(
            document.getElementById(
                "price"
            ).value
        );


    const icon =
        document.getElementById(
            "icon"
        ).value.trim();


    const highlight =
        document.getElementById(
            "highlight"
        ).checked;


    if (!name) {

        alert(
            "Package name is required."
        );

        return;

    }


    if (
        !Number.isFinite(price) ||
        price <= 0
    ) {

        alert(
            "Please enter a valid price."
        );

        return;

    }


    const button =
        document.getElementById(
            "addPackageBtn"
        );


    button.disabled = true;


    button.innerHTML = `

        <i
        class="fa-solid
        fa-spinner fa-spin mr-1">
        </i>

        Adding...

    `;


    try {

        const {
            data,
            error
        } =
            await supabaseClient
            .from("packages")
            .insert([{

                game:
                    game,

                name:
                    name,

                bonus:
                    bonus,

                price:
                    price,

                icon:
                    icon ||
                    "fa-solid fa-gem",

                highlight:
                    highlight,

                active:
                    true

            }])
            .select();


        if (error) {

            throw error;

        }


        console.log(
            "PACKAGE ADDED:",
            data
        );


        document.getElementById(
            "packageName"
        ).value = "";


        document.getElementById(
            "bonus"
        ).value = "";


        document.getElementById(
            "price"
        ).value = "";


        document.getElementById(
            "highlight"
        ).checked = false;


        await loadPackages();


        alert(
            "Package added successfully."
        );


    } catch (error) {

        console.error(
            "ADD PACKAGE ERROR:",
            error
        );


        alert(
            "Failed to add package:\n\n" +
            (
                error.message ||
                String(error)
            )
        );


    } finally {

        button.disabled = false;


        button.innerHTML = `

            <i
            class="fa-solid fa-plus mr-1">
            </i>

            Add Package

        `;

    }

}



/* =====================================================
   OPEN EDIT
===================================================== */

function openEdit(pkg) {

    document.getElementById(
        "editId"
    ).value =
        pkg.id;


    document.getElementById(
        "editName"
    ).value =
        pkg.name || "";


    document.getElementById(
        "editBonus"
    ).value =
        pkg.bonus || "";


    document.getElementById(
        "editPrice"
    ).value =
        pkg.price || "";


    document.getElementById(
        "editIcon"
    ).value =
        pkg.icon ||
        "fa-solid fa-gem";


    document.getElementById(
        "editHighlight"
    ).checked =
        toBoolean(
            pkg.highlight
        );


    document.getElementById(
        "editActive"
    ).checked =
        toBoolean(
            pkg.active
        );


    const modal =
        document.getElementById(
            "editModal"
        );


    modal.classList.remove(
        "hidden"
    );


    modal.classList.add(
        "flex"
    );

}



/* =====================================================
   CLOSE EDIT
===================================================== */

function closeEdit() {

    const modal =
        document.getElementById(
            "editModal"
        );


    modal.classList.add(
        "hidden"
    );


    modal.classList.remove(
        "flex"
    );

}



/* =====================================================
   SAVE EDIT
===================================================== */

async function saveEdit() {

    const id =
        document.getElementById(
            "editId"
        ).value;


    const name =
        document.getElementById(
            "editName"
        ).value.trim();


    const bonus =
        document.getElementById(
            "editBonus"
        ).value.trim();


    const price =
        Number(
            document.getElementById(
                "editPrice"
            ).value
        );


    const icon =
        document.getElementById(
            "editIcon"
        ).value.trim();


    const highlight =
        document.getElementById(
            "editHighlight"
        ).checked;


    const active =
        document.getElementById(
            "editActive"
        ).checked;


    if (!id) {

        alert(
            "Package ID is missing."
        );

        return;

    }


    if (!name) {

        alert(
            "Package name is required."
        );

        return;

    }


    if (
        !Number.isFinite(price) ||
        price <= 0
    ) {

        alert(
            "Please enter a valid price."
        );

        return;

    }


    const updateData = {

        name:
            name,

        bonus:
            bonus,

        price:
            price,

        icon:
            icon ||
            "fa-solid fa-gem",

        highlight:
            highlight,

        active:
            active

    };


    console.log(
        "UPDATING PACKAGE:",
        {
            id:
                id,

            ...updateData
        }
    );


    const button =
        document.getElementById(
            "saveEditBtn"
        );


    button.disabled = true;


    button.innerHTML = `

        <i
        class="fa-solid
        fa-spinner fa-spin mr-1">
        </i>

        Saving...

    `;


    try {

        const {
            data,
            error
        } =
            await supabaseClient
            .from("packages")
            .update(
                updateData
            )
            .eq(
                "id",
                id
            )
            .select();


        console.log(
            "SUPABASE UPDATE RESULT:",
            {
                data,
                error
            }
        );


        if (error) {

            throw error;

        }


        if (
            !data ||
            data.length === 0
        ) {

            alert(
                "Update was not applied.\n\n" +
                "Supabase returned 0 updated rows."
            );

            return;

        }


        console.log(
            "UPDATED PACKAGE:",
            data[0]
        );


        closeEdit();


        await loadPackages();


        alert(
            "Package updated successfully!\n\n" +
            "New Price: " +
            Number(
                data[0].price
            ).toLocaleString() +
            " Ks"
        );


    } catch (error) {

        console.error(
            "UPDATE PACKAGE ERROR:",
            error
        );


        alert(
            "Update failed:\n\n" +
            (
                error.message ||
                String(error)
            )
        );


    } finally {

        button.disabled = false;


        button.innerHTML = `

            <i
            class="fa-solid
            fa-floppy-disk mr-1">
            </i>

            Save Changes

        `;

    }

}



/* =====================================================
   TOGGLE ACTIVE
===================================================== */

async function toggleActive(
    id,
    current
) {

    if (!id) {

        alert(
            "Package ID is missing."
        );

        return;

    }


    const newStatus =
        !toBoolean(
            current
        );


    try {

        const {
            data,
            error
        } =
            await supabaseClient
            .from("packages")
            .update({

                active:
                    newStatus

            })
            .eq(
                "id",
                id
            )
            .select();


        console.log(
            "TOGGLE RESULT:",
            {
                data,
                error
            }
        );


        if (error) {

            throw error;

        }


        if (
            !data ||
            data.length === 0
        ) {

            alert(
                "Status was not changed.\n\n" +
                "Supabase returned 0 updated rows."
            );

            return;

        }


        await loadPackages();


    } catch (error) {

        console.error(
            "TOGGLE ERROR:",
            error
        );


        alert(
            "Failed to change status:\n\n" +
            (
                error.message ||
                String(error)
            )
        );

    }

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}
