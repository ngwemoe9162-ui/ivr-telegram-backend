<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IVR Admin Panel</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<script>
tailwind.config = {
    darkMode: "class",
    theme: {
        extend: {
            fontFamily: {
                sans: ["Inter", "sans-serif"]
            }
        }
    }
};
</script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Inter, sans-serif;
    background: #030712;
    color: #f3f4f6;
}

.glass {
    background: rgba(17,24,39,.78);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,.08);
}

input,
select {
    outline: none;
}

input:focus,
select:focus {
    border-color: #06b6d4 !important;
    box-shadow: 0 0 0 2px rgba(6,182,212,.12);
}

button {
    transition: .2s ease;
}

button:active {
    transform: scale(.97);
}
</style>
</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->

<div id="loginScreen"
class="fixed inset-0 z-[100] bg-gray-950 flex items-center justify-center p-4">

    <div class="glass rounded-3xl p-6 w-full max-w-sm">

        <div class="text-center mb-6">

            <div class="w-16 h-16 mx-auto rounded-2xl
            bg-gradient-to-br from-cyan-500 to-emerald-400
            flex items-center justify-center text-gray-950">

                <i class="fa-solid fa-lock text-2xl"></i>

            </div>

            <h1 class="font-black text-2xl mt-4">
                IVR <span class="text-cyan-400">ADMIN</span>
            </h1>

            <p class="text-xs text-gray-500 mt-1">
                Secure Admin Login
            </p>

        </div>

        <form id="loginForm" class="space-y-4">

            <div>

                <label class="text-xs text-gray-400">
                    Admin Email
                </label>

                <input
                    id="loginEmail"
                    type="email"
                    autocomplete="username"
                    required
                    placeholder="Enter admin email"
                    class="w-full mt-1 bg-gray-900
                    border border-gray-700 rounded-xl
                    px-3 py-3 text-sm">

            </div>

            <div>

                <label class="text-xs text-gray-400">
                    Password
                </label>

                <div class="relative">

                    <input
                        id="loginPassword"
                        type="password"
                        autocomplete="current-password"
                        required
                        placeholder="Enter password"
                        class="w-full mt-1 bg-gray-900
                        border border-gray-700 rounded-xl
                        px-3 py-3 pr-11 text-sm">

                    <button
                        type="button"
                        id="togglePasswordBtn"
                        class="absolute right-3 top-1/2
                        -translate-y-1/2 text-gray-500">

                        <i id="passwordEye"
                        class="fa-solid fa-eye"></i>

                    </button>

                </div>

            </div>

            <div id="loginError"
            class="hidden text-xs text-red-400
            bg-red-500/10 border border-red-500/20
            rounded-xl p-3">
            </div>

            <button
                id="loginBtn"
                type="submit"
                class="w-full py-3 rounded-xl
                bg-gradient-to-r from-cyan-500
                to-emerald-500 text-gray-950 font-black">

                <i class="fa-solid fa-right-to-bracket mr-1"></i>
                Login

            </button>

        </form>

    </div>
</div>


<!-- =====================================================
     ADMIN APP
===================================================== -->

<div id="adminApp" class="hidden">

<header class="sticky top-0 z-40 glass border-b border-gray-800">

    <div class="max-w-7xl mx-auto px-4 py-4
    flex items-center justify-between">

        <div class="flex items-center gap-3">

            <div class="w-11 h-11 rounded-xl
            bg-gradient-to-br from-cyan-500 to-emerald-400
            flex items-center justify-center text-gray-950">

                <i class="fa-solid fa-bolt text-xl"></i>

            </div>

            <div>

                <h1 class="font-black text-lg">
                    IVR <span class="text-cyan-400">ADMIN</span>
                </h1>

                <p class="text-[10px] text-gray-500">
                    Package Management Panel
                </p>

            </div>

        </div>

        <div class="flex items-center gap-3">

            <div class="hidden sm:flex text-xs
            text-emerald-400 items-center gap-2">

                <span class="w-2 h-2 bg-emerald-400
                rounded-full animate-pulse"></span>

                Database Online

            </div>

            <button
                id="logoutBtn"
                type="button"
                class="px-3 py-2 rounded-lg
                bg-red-500/10 text-red-400
                border border-red-500/20
                text-xs font-bold">

                <i class="fa-solid fa-right-from-bracket mr-1"></i>
                Logout

            </button>

        </div>

    </div>
</header>


<main class="max-w-7xl mx-auto px-4 py-6">

<!-- =====================================================
     STATS
===================================================== -->

<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">

    <div class="glass rounded-2xl p-4">
        <p class="text-xs text-gray-500">Total Packages</p>
        <p id="totalPackages"
        class="text-2xl font-black text-cyan-400 mt-1">0</p>
    </div>

    <div class="glass rounded-2xl p-4">
        <p class="text-xs text-gray-500">MLBB</p>
        <p id="mlbbCount"
        class="text-2xl font-black text-blue-400 mt-1">0</p>
    </div>

    <div class="glass rounded-2xl p-4">
        <p class="text-xs text-gray-500">PUBG</p>
        <p id="pubgCount"
        class="text-2xl font-black text-amber-400 mt-1">0</p>
    </div>

    <div class="glass rounded-2xl p-4">
        <p class="text-xs text-gray-500">Active</p>
        <p id="activeCount"
        class="text-2xl font-black text-emerald-400 mt-1">0</p>
    </div>

</div>


<!-- =====================================================
     ADD PACKAGE
===================================================== -->

<section class="glass rounded-2xl p-5 mb-6">

    <div class="mb-5">

        <h2 class="font-black text-lg">
            <i class="fa-solid fa-plus text-cyan-400 mr-2"></i>
            Add New Package
        </h2>

        <p class="text-xs text-gray-500 mt-1">
            Add Diamonds or UC without editing your website code.
        </p>

    </div>

    <form id="addPackageForm"
    class="grid md:grid-cols-2 lg:grid-cols-4 gap-4">

        <div>
            <label class="text-xs text-gray-400">Game</label>

            <select id="game"
            class="w-full mt-1 bg-gray-900
            border border-gray-700 rounded-xl
            px-3 py-3 text-sm">

                <option value="mlbb">Mobile Legends</option>
                <option value="pubg">PUBG Mobile</option>

            </select>
        </div>


        <div>
            <label class="text-xs text-gray-400">
                Package Name
            </label>

            <input
                id="packageName"
                type="text"
                required
                placeholder="e.g. 429 Diamonds"
                class="w-full mt-1 bg-gray-900
                border border-gray-700 rounded-xl
                px-3 py-3 text-sm">
        </div>


        <div>
            <label class="text-xs text-gray-400">
                Bonus
            </label>

            <input
                id="bonus"
                type="text"
                placeholder="+43 Bonus"
                class="w-full mt-1 bg-gray-900
                border border-gray-700 rounded-xl
                px-3 py-3 text-sm">
        </div>


        <div>
            <label class="text-xs text-gray-400">
                Price (Ks)
            </label>

            <input
                id="price"
                type="number"
                min="1"
                step="1"
                required
                placeholder="23000"
                class="w-full mt-1 bg-gray-900
                border border-gray-700 rounded-xl
                px-3 py-3 text-sm">
        </div>


        <div>
            <label class="text-xs text-gray-400">
                Icon
            </label>

            <input
                id="icon"
                type="text"
                value="fa-solid fa-gem"
                class="w-full mt-1 bg-gray-900
                border border-gray-700 rounded-xl
                px-3 py-3 text-sm">
        </div>


        <div class="flex items-end">

            <label class="flex items-center gap-3
            bg-gray-900 border border-gray-700
            rounded-xl px-4 py-3 w-full cursor-pointer">

                <input id="highlight" type="checkbox">

                <span class="text-sm">
                    HOT Package
                </span>

            </label>

        </div>


        <div class="flex items-end">

            <button
                id="addPackageBtn"
                type="submit"
                class="w-full py-3 rounded-xl
                bg-gradient-to-r from-cyan-500
                to-emerald-500 text-gray-950 font-black">

                <i class="fa-solid fa-plus mr-1"></i>
                Add Package

            </button>

        </div>

    </form>

</section>


<!-- =====================================================
     PACKAGE LIST
===================================================== -->

<section class="glass rounded-2xl p-5">

    <div class="flex flex-col md:flex-row
    md:items-center justify-between
    gap-3 mb-5">

        <div>

            <h2 class="font-black text-lg">

                <i class="fa-solid fa-box-open
                text-cyan-400 mr-2"></i>

                Packages

            </h2>

            <p class="text-xs text-gray-500 mt-1">
                Manage prices, status and packages.
            </p>

        </div>


        <select
            id="filterGame"
            class="bg-gray-900 border border-gray-700
            rounded-xl px-3 py-2 text-xs">

            <option value="all">All Games</option>
            <option value="mlbb">Mobile Legends</option>
            <option value="pubg">PUBG Mobile</option>

        </select>

    </div>


    <div id="packageList" class="space-y-3">

        <div class="text-center py-10 text-gray-500">

            <i class="fa-solid fa-spinner fa-spin text-xl"></i>

            <p class="text-xs mt-2">
                Loading packages...
            </p>

        </div>

    </div>

</section>

</main>
</div>


<!-- =====================================================
     EDIT MODAL
===================================================== -->

<div id="editModal"
class="fixed inset-0 z-50 hidden
bg-black/80 backdrop-blur-md
items-center justify-center p-4">

    <div class="glass rounded-2xl p-5
    w-full max-w-md">

        <div class="flex justify-between
        items-center mb-5">

            <h3 class="font-black text-lg">
                Edit Package
            </h3>

            <button id="closeEditBtn"
            type="button"
            class="text-gray-400 hover:text-white">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>


        <input id="editId" type="hidden">


        <form id="editForm" class="space-y-4">

            <div>

                <label class="text-xs text-gray-400">
                    Package Name
                </label>

                <input id="editName"
                type="text"
                required
                class="w-full mt-1 bg-gray-900
                border border-gray-700 rounded-xl
                px-3 py-3 text-sm">

            </div>


            <div>

                <label class="text-xs text-gray-400">
                    Bonus
                </label>

                <input id="editBonus"
                type="text"
                class="w-full mt-1 bg-gray-900
                border border-gray-700 rounded-xl
                px-3 py-3 text-sm">

            </div>


            <div>

                <label class="text-xs text-gray-400">
                    Price (Ks)
                </label>

                <input id="editPrice"
                type="number"
                min="1"
                required
                class="w-full mt-1 bg-gray-900
                border border-gray-700 rounded-xl
                px-3 py-3 text-sm">

            </div>


            <div>

                <label class="text-xs text-gray-400">
                    Icon
                </label>

                <input id="editIcon"
                type="text"
                class="w-full mt-1 bg-gray-900
                border border-gray-700 rounded-xl
                px-3 py-3 text-sm">

            </div>


            <label class="flex items-center gap-3">

                <input id="editHighlight"
                type="checkbox">

                <span class="text-sm">
                    HOT Package
                </span>

            </label>


            <label class="flex items-center gap-3">

                <input id="editActive"
                type="checkbox">

                <span class="text-sm">
                    Active
                </span>

            </label>


            <button
                id="saveEditBtn"
                type="submit"
                class="w-full py-3 rounded-xl
                bg-gradient-to-r from-cyan-500
                to-emerald-500 text-gray-950 font-black">

                <i class="fa-solid fa-floppy-disk mr-1"></i>
                Save Changes

            </button>

        </form>

    </div>
</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://pjiiipywtywkztgjpmro.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_6Vjf1hUSWxI2HXRJ9eSHfw_OU8Vm2G5";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =====================================================
   ELEMENTS
===================================================== */

const loginScreen =
document.getElementById("loginScreen");

const adminApp =
document.getElementById("adminApp");

const loginForm =
document.getElementById("loginForm");

const addPackageForm =
document.getElementById("addPackageForm");

const editForm =
document.getElementById("editForm");

const loginBtn =
document.getElementById("loginBtn");

const loginError =
document.getElementById("loginError");


/* =====================================================
   START
===================================================== */

window.addEventListener("load", async () => {

    const {
        data,
        error
    } = await supabaseClient.auth.getSession();

    if (error) {

        console.error(error);

        showLogin();

        return;
    }

    if (data.session) {

        showAdminPanel();

    } else {

        showLogin();

    }

});


/* =====================================================
   AUTH STATE
===================================================== */

supabaseClient.auth.onAuthStateChange(
    (event, session) => {

        if (session) {

            showAdminPanel();

        } else {

            showLogin();

        }

    }
);


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
"submit",
async function(event) {

    event.preventDefault();

    hideLoginError();

    const email =
    document.getElementById(
        "loginEmail"
    ).value.trim();

    const password =
    document.getElementById(
        "loginPassword"
    ).value;

    if (!email) {

        showLoginError(
            "Please enter your admin email."
        );

        return;

    }

    if (!password) {

        showLoginError(
            "Please enter your password."
        );

        return;

    }

    loginBtn.disabled = true;

    loginBtn.innerHTML = `
        <i class="fa-solid fa-spinner fa-spin mr-1"></i>
        Logging in...
    `;

    try {

        const {
            data,
            error
        } =
        await supabaseClient.auth
        .signInWithPassword({
            email: email,
            password: password
        });

        if (error) {

            throw error;

        }

        if (!data.session) {

            throw new Error(
                "Login succeeded but session was not created."
            );

        }

        document.getElementById(
            "loginPassword"
        ).value = "";

        showAdminPanel();

    } catch (error) {

        console.error(
            "LOGIN ERROR:",
            error
        );

        showLoginError(
            error.message ||
            "Login failed."
        );

    } finally {

        loginBtn.disabled = false;

        loginBtn.innerHTML = `
            <i class="fa-solid fa-right-to-bracket mr-1"></i>
            Login
        `;

    }

});


/* =====================================================
   LOGIN ERROR
===================================================== */

function showLoginError(message) {

    loginError.textContent = message;

    loginError.classList.remove("hidden");

}

function hideLoginError() {

    loginError.textContent = "";

    loginError.classList.add("hidden");

}


/* =====================================================
   SHOW / HIDE
===================================================== */

function showLogin() {

    loginScreen.classList.remove("hidden");

    adminApp.classList.add("hidden");

}

async function showAdminPanel() {

    loginScreen.classList.add("hidden");

    adminApp.classList.remove("hidden");

    await loadPackages();

}


/* =====================================================
   PASSWORD TOGGLE
===================================================== */

document.getElementById(
    "togglePasswordBtn"
).addEventListener(
"click",
function() {

    const input =
    document.getElementById(
        "loginPassword"
    );

    const eye =
    document.getElementById(
        "passwordEye"
    );

    if (input.type === "password") {

        input.type = "text";

        eye.className =
        "fa-solid fa-eye-slash";

    } else {

        input.type = "password";

        eye.className =
        "fa-solid fa-eye";

    }

});


/* =====================================================
   LOGOUT
===================================================== */

document.getElementById(
    "logoutBtn"
).addEventListener(
"click",
async function() {

    if (!confirm(
        "Are you sure you want to logout?"
    )) {

        return;

    }

    const {
        error
    } =
    await supabaseClient.auth.signOut();

    if (error) {

        alert(
            "Logout failed:\n\n" +
            error.message
        );

        return;

    }

    showLogin();

});


/* =====================================================
   FILTER
===================================================== */

document.getElementById(
    "filterGame"
).addEventListener(
"change",
loadPackages
);


/* =====================================================
   BOOLEAN
===================================================== */

function toBoolean(value) {

    if (typeof value === "boolean") {

        return value;

    }

    if (typeof value === "number") {

        return value === 1;

    }

    return [
        "true",
        "1",
        "yes",
        "on"
    ].includes(
        String(value ?? "")
        .trim()
        .toLowerCase()
    );

}


/* =====================================================
   LOAD PACKAGES
===================================================== */

async function loadPackages() {

    const list =
    document.getElementById(
        "packageList"
    );

    const filter =
    document.getElementById(
        "filterGame"
    ).value;

    list.innerHTML = `
        <div class="text-center py-10 text-gray-500">
            <i class="fa-solid fa-spinner fa-spin text-xl"></i>
            <p class="text-xs mt-2">
                Loading packages...
            </p>
        </div>
    `;

    try {

        let query =
        supabaseClient
        .from("packages")
        .select(`
            id,
            game,
            name,
            bonus,
            price,
            icon,
            highlight,
            active
        `)
        .order(
            "id",
            {
                ascending: true
            }
        );

        if (filter !== "all") {

            query =
            query.eq(
                "game",
                filter
            );

        }

        const {
            data,
            error
        } = await query;

        if (error) {

            throw error;

        }

        const packages =
        (data || []).map(pkg => ({

            id: pkg.id,

            game:
            String(
                pkg.game ?? ""
            )
            .trim()
            .toLowerCase(),

            name:
            String(
                pkg.name ?? ""
            ),

            bonus:
            String(
                pkg.bonus ?? ""
            ),

            price:
            Number(
                pkg.price
            ) || 0,

            icon:
            String(
                pkg.icon ?? ""
            ).trim()
            ||
            "fa-solid fa-gem",

            highlight:
            toBoolean(
                pkg.highlight
            ),

            active:
            toBoolean(
                pkg.active
            )

        }));


        updateStats(packages);


        if (!packages.length) {

            list.innerHTML = `
                <div class="text-center py-10 text-gray-500">
                    <i class="fa-solid fa-box-open text-2xl mb-2"></i>
                    <p class="text-sm">
                        No packages found.
                    </p>
                </div>
            `;

            return;

        }


        list.innerHTML = "";


        packages.forEach(pkg => {

            const card =
            document.createElement("div");

            card.className =
            "bg-gray-950/70 border border-gray-800 " +
            "rounded-xl p-4 flex flex-col md:flex-row " +
            "md:items-center gap-4";


            const gameName =
            pkg.game === "mlbb"
            ? "Mobile Legends"
            : "PUBG Mobile";


            const icon =
            escapeHtml(pkg.icon);


            const name =
            escapeHtml(pkg.name);


            const bonus =
            escapeHtml(pkg.bonus);


            card.innerHTML = `

                <div class="w-11 h-11 shrink-0 rounded-xl
                bg-cyan-500/10 text-cyan-400
                flex items-center justify-center">

                    <i class="${icon}"></i>

                </div>


                <div class="flex-1">

                    <div class="flex items-center
                    gap-2 flex-wrap">

                        <span class="font-bold text-white">
                            ${name}
                        </span>

                        ${
                            pkg.highlight
                            ?
                            `
                            <span class="text-[9px]
                            bg-amber-500 text-black
                            px-2 py-0.5 rounded font-black">
                                HOT
                            </span>
                            `
                            :
                            ""
                        }

                        ${
                            pkg.active
                            ?
                            `
                            <span class="text-[9px]
                            bg-emerald-500/20
                            text-emerald-400
                            px-2 py-0.5 rounded">
                                ACTIVE
                            </span>
                            `
                            :
                            `
                            <span class="text-[9px]
                            bg-red-500/20
                            text-red-400
                            px-2 py-0.5 rounded">
                                OFF
                            </span>
                            `
                        }

                    </div>

                    <div class="text-xs text-gray-500 mt-1">
                        ${gameName} • ${bonus}
                    </div>

                </div>


                <div class="text-emerald-400
                font-black whitespace-nowrap">

                    ${Number(pkg.price)
                    .toLocaleString()} Ks

                </div>


                <div class="flex gap-2">

                    <button
                        type="button"
                        class="edit-btn px-3 py-2
                        rounded-lg bg-cyan-500/10
                        text-cyan-400
                        border border-cyan-500/20">

                        <i class="fa-solid fa-pen"></i>

                    </button>


                    <button
                        type="button"
                        class="toggle-btn
                        px-3 py-2 rounded-lg
                        bg-gray-800 text-gray-300">

                        <i class="fa-solid ${
                            pkg.active
                            ? "fa-eye-slash"
                            : "fa-eye"
                        }"></i>

                    </button>

                </div>

            `;


            card.querySelector(
                ".edit-btn"
            ).addEventListener(
                "click",
                () => openEdit(pkg)
            );


            card.querySelector(
                ".toggle-btn"
            ).addEventListener(
                "click",
                () =>
                toggleActive(
                    pkg.id,
                    pkg.active
                )
            );


            list.appendChild(card);

        });


    } catch (error) {

        console.error(
            "LOAD ERROR:",
            error
        );

        list.innerHTML = `
            <div class="text-center py-8
            text-red-400 text-sm">

                <i class="fa-solid
                fa-triangle-exclamation
                text-xl mb-2"></i>

                <p>Failed to load packages.</p>

                <p class="text-xs text-gray-500
                mt-2 break-all">

                    ${escapeHtml(
                        error.message ||
                        String(error)
                    )}

                </p>

            </div>
        `;

    }

}


/* =====================================================
   STATS
===================================================== */

function updateStats(data) {

    document.getElementById(
        "totalPackages"
    ).textContent =
    data.length;

    document.getElementById(
        "mlbbCount"
    ).textContent =
    data.filter(
        x => x.game === "mlbb"
    ).length;

    document.getElementById(
        "pubgCount"
    ).textContent =
    data.filter(
        x => x.game === "pubg"
    ).length;

    document.getElementById(
        "activeCount"
    ).textContent =
    data.filter(
        x => x.active === true
    ).length;

}

/* =====================================================
   OPEN EDIT
===================================================== */

function openEdit(pkg) {

    document.getElementById(
        "editId"
    ).value =
    pkg.id;

    document.getElementById(
        "editName"
    ).value =
    pkg.name || "";

    document.getElementById(
        "editBonus"
    ).value =
    pkg.bonus || "";

    document.getElementById(
        "editPrice"
    ).value =
    pkg.price || "";

    document.getElementById(
        "editIcon"
    ).value =
    pkg.icon ||
    "fa-solid fa-gem";

    document.getElementById(
        "editHighlight"
    ).checked =
    toBoolean(
        pkg.highlight
    );

    document.getElementById(
        "editActive"
    ).checked =
    toBoolean(
        pkg.active
    );


    const modal =
    document.getElementById(
        "editModal"
    );

    modal.classList.remove(
        "hidden"
    );

    modal.classList.add(
        "flex"
    );

}


/* =====================================================
   CLOSE EDIT
===================================================== */

function closeEdit() {

    const modal =
    document.getElementById(
        "editModal"
    );

    modal.classList.add(
        "hidden"
    );

    modal.classList.remove(
        "flex"
    );

}


document.getElementById(
    "closeEditBtn"
).addEventListener(
    "click",
    closeEdit
);


/* =====================================================
   SAVE EDIT

editForm.addEventListener(
"submit",
async function(event) {

    event.preventDefault();

    const id =
    document.getElementById(
        "editId"
    ).value;

    const name =
    document.getElementById(
        "editName"
    ).value.trim();

    const bonus =
    document.getElementById(
        "editBonus"
    ).value.trim();

    const price =
    Number(
        document.getElementById(
            "editPrice"
        ).value
    );

    const icon =
    document.getElementById(
        "editIcon"
    ).value.trim();

    const highlight =
    document.getElementById(
        "editHighlight"
    ).checked;

    const active =
    document.getElementById(
        "editActive"
    ).checked;


    if (!id || !name) {

        alert(
            "Package ID and name are required."
        );

        return;

    }


    if (
        !Number.isFinite(price) ||
        price <= 0
    ) {

        alert(
            "Please enter a valid price."
        );

        return;

    }


    const button =
    document.getElementById(
        "saveEditBtn"
    );

    button.disabled = true;

    button.innerHTML = `
        <i class="fa-solid fa-spinner fa-spin mr-1"></i>
        Saving...
    `;


    try {

        const {
            data,
            error
        } =
        await supabaseClient
        .from("packages")
        .update({
            name: name,
            bonus: bonus,
            price: price,
            icon:

                "fa-solid fa-gem",
            highlight: highlight,
            active: active
        })
        .eq(

            )
        );

        button.innerHTML = `
            <i class="fa-solid fa-floppy-disk mr-1"></i>
            Save Changes

    }

/* =====================================================
   TOGGLE ACTIVE
===================================================== */

async function toggleActive(
    id,
    current
) {

    const newStatus =
    !toBoolean(current);


    try {

        const {
            data,
            error
        } =
        await supabaseClient
        .from("packages")
        .update({
            active: newStatus
        })
        .eq(
            "id",
            id
        )
        .select()
        .single();


        if (error) {

            throw error;

        }


        if (!data) {

            throw new Error(
                "No package was updated."
            );

        }


        await loadPackages();


    } catch (error) {

        console.error(
            "TOGGLE ERROR:",
            error
        );

        alert(
            "Failed to change status:\n\n" +
            (
                error.message ||
                String(error)
            )
        );

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}
