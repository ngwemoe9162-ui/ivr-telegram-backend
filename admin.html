<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IVR Admin Panel</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            fontFamily: {
                sans: ['Inter', 'sans-serif']
            }
        }
    }
};
</script>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Inter, sans-serif;
    background: #030712;
    color: #f3f4f6;
}

.glass {
    background: rgba(17,24,39,.75);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,.08);
}

input, select {
    outline: none;
}

input:focus, select:focus {
    border-color: #06b6d4 !important;
    box-shadow: 0 0 0 2px rgba(6,182,212,.12);
}
</style>
</head>

<body>

<header class="sticky top-0 z-40 glass border-b border-gray-800">

<div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">

<div class="flex items-center gap-3">

<div class="w-11 h-11 rounded-xl bg-gradient-to-br from-cyan-500 to-emerald-400 flex items-center justify-center text-gray-950">
<i class="fa-solid fa-bolt text-xl"></i>
</div>

<div>
<h1 class="font-black text-lg">
IVR <span class="text-cyan-400">ADMIN</span>
</h1>

<p class="text-[10px] text-gray-500">
Package Management Panel
</p>
</div>

</div>

<div class="text-xs text-emerald-400 flex items-center gap-2">
<span class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></span>
Database Online
</div>

</div>

</header>


<main class="max-w-7xl mx-auto px-4 py-6">

<!-- DASHBOARD -->

<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">

<div class="glass rounded-2xl p-4">
<p class="text-xs text-gray-500">Total Packages</p>
<p id="totalPackages" class="text-2xl font-black text-cyan-400 mt-1">0</p>
</div>

<div class="glass rounded-2xl p-4">
<p class="text-xs text-gray-500">MLBB</p>
<p id="mlbbCount" class="text-2xl font-black text-blue-400 mt-1">0</p>
</div>

<div class="glass rounded-2xl p-4">
<p class="text-xs text-gray-500">PUBG</p>
<p id="pubgCount" class="text-2xl font-black text-amber-400 mt-1">0</p>
</div>

<div class="glass rounded-2xl p-4">
<p class="text-xs text-gray-500">Active</p>
<p id="activeCount" class="text-2xl font-black text-emerald-400 mt-1">0</p>
</div>

</div>


<!-- ADD PACKAGE -->

<section class="glass rounded-2xl p-5 mb-6">

<div class="flex items-center justify-between mb-5">

<div>
<h2 class="font-black text-lg">
<i class="fa-solid fa-plus text-cyan-400 mr-2"></i>
Add New Package
</h2>

<p class="text-xs text-gray-500 mt-1">
Add Diamonds or UC without editing your website code.
</p>
</div>

</div>


<div class="grid md:grid-cols-2 lg:grid-cols-4 gap-4">

<div>
<label class="text-xs text-gray-400">Game</label>

<select id="game"
class="w-full mt-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-3 text-sm">

<option value="mlbb">Mobile Legends</option>
<option value="pubg">PUBG Mobile</option>

</select>
</div>


<div>
<label class="text-xs text-gray-400">Package Name</label>

<input
id="packageName"
type="text"
placeholder="e.g. 429 Diamonds"
class="w-full mt-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-3 text-sm">
</div>


<div>
<label class="text-xs text-gray-400">Bonus</label>

<input
id="bonus"
type="text"
placeholder="+43 Bonus"
class="w-full mt-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-3 text-sm">
</div>


<div>
<label class="text-xs text-gray-400">Price (Ks)</label>

<input
id="price"
type="number"
placeholder="23000"
class="w-full mt-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-3 text-sm">
</div>


<div>
<label class="text-xs text-gray-400">Icon</label>

<input
id="icon"
type="text"
value="fa-solid fa-gem"
class="w-full mt-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-3 text-sm">
</div>


<div class="flex items-end">

<label class="flex items-center gap-3 bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 w-full cursor-pointer">

<input id="highlight" type="checkbox">

<span class="text-sm">
HOT Package
</span>

</label>

</div>


<div class="flex items-end">

<button
onclick="addPackage()"
class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-emerald-500 text-gray-950 font-black">

<i class="fa-solid fa-plus mr-1"></i>
Add Package

</button>

</div>

</div>

</section>


<!-- PACKAGE LIST -->

<section class="glass rounded-2xl p-5">

<div class="flex flex-col md:flex-row md:items-center justify-between gap-3 mb-5">

<div>
<h2 class="font-black text-lg">
<i class="fa-solid fa-box-open text-cyan-400 mr-2"></i>
Packages
</h2>

<p class="text-xs text-gray-500">
Manage prices, status and packages.
</p>
</div>

<select
id="filterGame"
onchange="loadPackages()"
class="bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-xs">

<option value="all">All Games</option>
<option value="mlbb">Mobile Legends</option>
<option value="pubg">PUBG Mobile</option>

</select>

</div>


<div id="packageList" class="space-y-3">

<div class="text-center py-10 text-gray-500">
<i class="fa-solid fa-spinner fa-spin text-xl"></i>
<p class="text-xs mt-2">Loading packages...</p>
</div>

</div>

</section>

</main>


<!-- EDIT MODAL -->

<div
id="editModal"
class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md items-center justify-center p-4">

<div class="glass rounded-2xl p-5 w-full max-w-md">

<div class="flex justify-between items-center mb-5">

<h3 class="font-black text-lg">
Edit Package
</h3>

<button onclick="closeEdit()"
class="text-gray-400 hover:text-white">

<i class="fa-solid fa-xmark"></i>

</button>

</div>


<input id="editId" type="hidden">


<div class="space-y-4">

<div>
<label class="text-xs text-gray-400">Package Name</label>

<input id="editName"
class="w-full mt-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-3 text-sm">
</div>


<div>
<label class="text-xs text-gray-400">Bonus</label>

<input id="editBonus"
class="w-full mt-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-3 text-sm">
</div>


<div>
<label class="text-xs text-gray-400">Price</label>

<input id="editPrice"
type="number"
class="w-full mt-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-3 text-sm">
</div>


<div>
<label class="text-xs text-gray-400">Icon</label>

<input id="editIcon"
class="w-full mt-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-3 text-sm">
</div>


<label class="flex items-center gap-3">

<input id="editHighlight" type="checkbox">

<span class="text-sm">HOT Package</span>

</label>


<label class="flex items-center gap-3">

<input id="editActive" type="checkbox">

<span class="text-sm">Active</span>

</label>


<button
onclick="saveEdit()"
class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-emerald-500 text-gray-950 font-black">

Save Changes

</button>

</div>

</div>

</div>


<script>

/* =====================================================
   SUPABASE CONFIG
   ===================================================== */

const SUPABASE_URL =
"https://pjiiipywtywkztgjpmro.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_6Vjf1hUSWxI2HXRJ9eSHfw_OU8Vm2G5";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =====================================================
   LOAD
   ===================================================== */

window.addEventListener("load", loadPackages);


/* =====================================================
   LOAD PACKAGES
   ===================================================== */

async function loadPackages() {

    const list =
        document.getElementById("packageList");

    const filter =
        document.getElementById("filterGame").value;


    list.innerHTML = `
        <div class="text-center py-10 text-gray-500">
            <i class="fa-solid fa-spinner fa-spin text-xl"></i>
            <p class="text-xs mt-2">Loading packages...</p>
        </div>
    `;


    let query =
        supabaseClient
        .from("packages")
        .select("*")
        .order("id", {ascending:true});


    if(filter !== "all") {
        query = query.eq("game", filter);
    }


    const { data, error } = await query;


    if(error) {

        console.error(error);

        list.innerHTML = `
            <div class="text-center py-8 text-red-400 text-sm">
                Failed to load packages.
                <br>
                <span class="text-xs text-gray-500">
                ${escapeHtml(error.message)}
                </span>
            </div>
        `;

        return;
    }


    updateStats(data || []);


    if(!data.length) {

        list.innerHTML = `
            <div class="text-center py-10 text-gray-500">
                No packages found.
            </div>
        `;

        return;
    }


    list.innerHTML = "";


    data.forEach(pkg => {

        const card =
            document.createElement("div");

        card.className =
            "bg-gray-950/70 border border-gray-800 rounded-xl p-4 flex flex-col md:flex-row md:items-center gap-4";


        card.innerHTML = `

            <div class="w-11 h-11 shrink-0 rounded-xl
                bg-cyan-500/10 text-cyan-400
                flex items-center justify-center">

                <i class="${escapeHtml(pkg.icon || 'fa-solid fa-gem')}"></i>

            </div>


            <div class="flex-1">

                <div class="flex items-center gap-2 flex-wrap">

                    <span class="font-bold text-white">
                        ${escapeHtml(pkg.name)}
                    </span>

                    ${pkg.highlight ? `
                        <span class="text-[9px] bg-amber-500 text-black px-2 py-0.5 rounded font-black">
                            HOT
                        </span>
                    ` : ""}

                    ${pkg.active ? `
                        <span class="text-[9px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded">
                            ACTIVE
                        </span>
                    ` : `
                        <span class="text-[9px] bg-red-500/20 text-red-400 px-2 py-0.5 rounded">
                            OFF
                        </span>
                    `}

                </div>


                <div class="text-xs text-gray-500 mt-1">

                    ${pkg.game === "mlbb"
                        ? "Mobile Legends"
                        : "PUBG Mobile"}

                    • ${escapeHtml(pkg.bonus || "")}

                </div>

            </div>


            <div class="text-emerald-400 font-black">

                ${Number(pkg.price).toLocaleString()} Ks

            </div>


            <div class="flex gap-2">

                <button
                    onclick='openEdit(${JSON.stringify(pkg)})'
                    class="px-3 py-2 rounded-lg bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">

                    <i class="fa-solid fa-pen"></i>

                </button>


                <button
                    onclick="toggleActive(${pkg.id}, ${pkg.active})"
                    class="px-3 py-2 rounded-lg bg-gray-800 text-gray-300">

                    <i class="fa-solid ${pkg.active ? 'fa-eye-slash' : 'fa-eye'}"></i>

                </button>

            </div>

        `;


        list.appendChild(card);

    });

}


/* =====================================================
   STATS
   ===================================================== */

function updateStats(data) {

    document.getElementById("totalPackages").innerText =
        data.length;

    document.getElementById("mlbbCount").innerText =
        data.filter(x => x.game === "mlbb").length;

    document.getElementById("pubgCount").innerText =
        data.filter(x => x.game === "pubg").length;

    document.getElementById("activeCount").innerText =
        data.filter(x => x.active).length;
}


/* =====================================================
   ADD PACKAGE
   ===================================================== */

async function addPackage() {

    const game =
        document.getElementById("game").value;

    const name =
        document.getElementById("packageName").value.trim();

    const bonus =
        document.getElementById("bonus").value.trim();

    const price =
        Number(document.getElementById("price").value);

    const icon =
        document.getElementById("icon").value.trim();

    const highlight =
        document.getElementById("highlight").checked;


    if(!name || !price) {

        alert("Package name and price are required.");

        return;
    }


    const { error } =
        await supabaseClient
        .from("packages")
        .insert([{
            game: game,
            name: name,
            bonus: bonus,
            price: price,
            icon: icon || "fa-solid fa-gem",
            highlight: highlight,
            active: true
        }]);


    if(error) {

        alert("Failed to add package:\n" + error.message);

        return;
    }


    document.getElementById("packageName").value = "";
    document.getElementById("bonus").value = "";
    document.getElementById("price").value = "";
    document.getElementById("highlight").checked = false;


    await loadPackages();

    alert("Package added successfully.");
}


/* =====================================================
   EDIT
   ===================================================== */

function openEdit(pkg) {

    document.getElementById("editId").value =
        pkg.id;

    document.getElementById("editName").value =
        pkg.name || "";

    document.getElementById("editBonus").value =
        pkg.bonus || "";

    document.getElementById("editPrice").value =
        pkg.price || "";

    document.getElementById("editIcon").value =
        pkg.icon || "fa-solid fa-gem";

    document.getElementById("editHighlight").checked =
        !!pkg.highlight;

    document.getElementById("editActive").checked =
        !!pkg.active;


    const modal =
        document.getElementById("editModal");

    modal.classList.remove("hidden");
    modal.classList.add("flex");
}


function closeEdit() {

    const modal =
        document.getElementById("editModal");

    modal.classList.add("hidden");
    modal.classList.remove("flex");
}


/* =====================================================
   SAVE EDIT
   ===================================================== */

async function saveEdit() {

    const id =
        document.getElementById("editId").value;

    const name =
        document.getElementById("editName").value.trim();

    const bonus =
        document.getElementById("editBonus").value.trim();

    const price =
        Number(document.getElementById("editPrice").value);

    const icon =
        document.getElementById("editIcon").value.trim();

    const highlight =
        document.getElementById("editHighlight").checked;

    const active =
        document.getElementById("editActive").checked;


    const { error } =
        await supabaseClient
        .from("packages")
        .update({
            name: name,
            bonus: bonus,
            price: price,
            icon: icon,
            highlight: highlight,
            active: active
        })
        .eq("id", id);


    if(error) {

        alert("Update failed:\n" + error.message);

        return;
    }


    closeEdit();

    await loadPackages();

    alert("Package updated successfully.");
}


/* =====================================================
   ACTIVE / OFF
   ===================================================== */

async function toggleActive(id, current) {

    const { error } =
        await supabaseClient
        .from("packages")
        .update({
            active: !current
        })
        .eq("id", id);


    if(error) {

        alert("Failed:\n" + error.message);

        return;
    }


    loadPackages();
}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
