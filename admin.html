<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IVR Admin Panel</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    font-family: Arial, sans-serif;
}
</style>
</head>

<body class="bg-slate-950 text-white min-h-screen">

<div class="max-w-6xl mx-auto px-4 py-8">

    <div class="mb-8">
        <h1 class="text-3xl font-black">
            IVR <span class="text-cyan-400">Admin Panel</span>
        </h1>

        <p class="text-gray-400 mt-1">
            Manage Diamonds & UC Packages
        </p>
    </div>


    <!-- ADD PACKAGE -->

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 mb-8">

        <h2 class="text-xl font-bold mb-5">
            ➕ Add New Package
        </h2>

        <div class="grid md:grid-cols-2 gap-4">

            <div>
                <label class="text-sm text-gray-400">
                    Game
                </label>

                <select id="game"
                    class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3">

                    <option value="mlbb">
                        Mobile Legends
                    </option>

                    <option value="pubg">
                        PUBG Mobile
                    </option>

                </select>
            </div>


            <div>
                <label class="text-sm text-gray-400">
                    Package ID
                </label>

                <input
                    id="package_id"
                    placeholder="ml_9 / pubg_6"
                    class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3">
            </div>


            <div>
                <label class="text-sm text-gray-400">
                    Package Name
                </label>

                <input
                    id="name"
                    placeholder="500 Diamonds / 660 UC"
                    class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3">
            </div>


            <div>
                <label class="text-sm text-gray-400">
                    Bonus
                </label>

                <input
                    id="bonus"
                    placeholder="+50 Bonus"
                    class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3">
            </div>


            <div>
                <label class="text-sm text-gray-400">
                    Price (Ks)
                </label>

                <input
                    id="price"
                    type="number"
                    placeholder="25000"
                    class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3">
            </div>


            <div>
                <label class="text-sm text-gray-400">
                    Icon
                </label>

                <input
                    id="icon"
                    value="fa-solid fa-gem"
                    class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3">
            </div>

        </div>


        <div class="flex items-center gap-6 mt-5">

            <label class="flex items-center gap-2">
                <input type="checkbox" id="highlight">
                <span class="text-sm">
                    HOT Package
                </span>
            </label>


            <label class="flex items-center gap-2">
                <input type="checkbox" id="active" checked>
                <span class="text-sm">
                    Active
                </span>
            </label>

        </div>


        <button
            onclick="addPackage()"
            class="mt-6 w-full md:w-auto px-6 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-emerald-500 text-black font-black">

            ➕ Add Package

        </button>

    </div>


    <!-- PACKAGE LIST -->

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">

        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-5">

            <h2 class="text-xl font-bold">
                📦 Packages
            </h2>

            <button
                onclick="loadPackages()"
                class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-sm">

                🔄 Refresh

            </button>

        </div>


        <div id="status"
            class="hidden mb-4 p-3 rounded-lg text-sm">
        </div>


        <div class="overflow-x-auto">

            <table class="w-full text-sm">

                <thead>

                    <tr class="border-b border-slate-800 text-gray-400">

                        <th class="text-left p-3">Game</th>
                        <th class="text-left p-3">Package</th>
                        <th class="text-left p-3">Bonus</th>
                        <th class="text-left p-3">Price</th>
                        <th class="text-left p-3">Status</th>

                    </tr>

                </thead>

                <tbody id="packageList">

                    <tr>
                        <td colspan="5"
                            class="p-6 text-center text-gray-500">

                            Loading...

                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
    "https://pjiiipywtywkztgjpmro.supabase.co/rest/v1/";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_6Vjf1hUSWxI2HXRJ9eSHfw_OU8Vm2G5";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================
   STATUS
========================================= */

function showStatus(message, success = true) {

    const box =
        document.getElementById("status");

    box.innerText = message;

    box.className =
        "mb-4 p-3 rounded-lg text-sm " +
        (success
            ? "bg-emerald-500/20 text-emerald-300 border border-emerald-500/30"
            : "bg-red-500/20 text-red-300 border border-red-500/30");

}


/* =========================================
   ADD PACKAGE
========================================= */

async function addPackage() {

    const game =
        document.getElementById("game").value;

    const package_id =
        document.getElementById("package_id").value.trim();

    const name =
        document.getElementById("name").value.trim();

    const bonus =
        document.getElementById("bonus").value.trim();

    const price =
        Number(document.getElementById("price").value);

    const icon =
        document.getElementById("icon").value.trim();

    const highlight =
        document.getElementById("highlight").checked;

    const active =
        document.getElementById("active").checked;


    if (!package_id || !name || !price) {

        showStatus(
            "Please fill Package ID, Name and Price.",
            false
        );

        return;
    }


    const { error } =
        await supabaseClient
            .from("packages")
            .insert({

                game: game,
                package_id: package_id,
                name: name,
                bonus: bonus,
                price: price,
                icon: icon,
                highlight: highlight,
                active: active

            });


    if (error) {

        console.error(error);

        showStatus(
            error.message,
            false
        );

        return;
    }


    showStatus(
        "✅ Package added successfully!"
    );


    document.getElementById("package_id").value = "";
    document.getElementById("name").value = "";
    document.getElementById("bonus").value = "";
    document.getElementById("price").value = "";
    document.getElementById("highlight").checked = false;

    loadPackages();

}


/* =========================================
   LOAD PACKAGES
========================================= */

async function loadPackages() {

    const list =
        document.getElementById("packageList");


    list.innerHTML = `
        <tr>
            <td colspan="5"
                class="p-6 text-center text-gray-500">
                Loading...
            </td>
        </tr>
    `;


    const { data, error } =
        await supabaseClient
            .from("packages")
            .select("*")
            .order("game")
            .order("id");


    if (error) {

        console.error(error);

        list.innerHTML = `
            <tr>
                <td colspan="5"
                    class="p-6 text-center text-red-400">
                    ${error.message}
                </td>
            </tr>
        `;

        return;
    }


    if (!data || data.length === 0) {

        list.innerHTML = `
            <tr>
                <td colspan="5"
                    class="p-6 text-center text-gray-500">
                    No packages found.
                </td>
            </tr>
        `;

        return;
    }


    list.innerHTML = "";


    data.forEach(pkg => {

        const row =
            document.createElement("tr");

        row.className =
            "border-b border-slate-800";


        row.innerHTML = `

            <td class="p-3 font-bold uppercase">
                ${pkg.game}
            </td>

            <td class="p-3">
                ${pkg.name}
            </td>

            <td class="p-3 text-cyan-400">
                ${pkg.bonus || "-"}
            </td>

            <td class="p-3 text-emerald-400 font-bold">
                ${Number(pkg.price).toLocaleString()} Ks
            </td>

            <td class="p-3">
                ${
                    pkg.active
                    ? '<span class="text-emerald-400">● Active</span>'
                    : '<span class="text-red-400">● Disabled</span>'
                }
            </td>

        `;


        list.appendChild(row);

    });

}


/* =========================================
   START
========================================= */

loadPackages();

</script>

</body>
</html>
